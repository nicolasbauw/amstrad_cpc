# Reference example, not a live config file: ByteBox always reads
# ~/.config/bytebox/config.toml, in both debug and release builds — this
# file in the repo is never read by the running program, no matter how it
# was built or launched. Copy whatever sections you need over there.

[drives]
drive_b = true

[debugger]
keyboard = false
# Reports on the console whenever the audio regulation has to step in
# (silence inserted because the sound card ran dry, or a frame dropped
# because it was too far behind). Both stretch or skip the sound, so they
# are worth knowing about when chasing a timing problem.
audio = false

[file]
# Directory searched for a disk image given by its bare filename (console
# "disk" command, or the --disk command-line option), when that name is not
# already a valid path as given. A full or relative path still takes
# priority over this default.
dsk_path = "~/.bytebox/DSK"
# Same role as dsk_path above, but for tape images (console "tape" command,
# or --tape) — a separate directory rather than reusing dsk_path, since disk
# and tape images live in different folders.
cdt_path = "~/.bytebox/CDT"

[display]
# Window zoom level at startup: "x1", "x2", "x3" or "fullscreen". Same
# effect as pressing F1/F2/F3/F4 once the window is up. Missing or
# unrecognized falls back to "x1".
default_zoom = "x1"

[memory]
# Extra 64KB RAM banks beyond the 6128's standard 128KB, in the style of
# period third-party expansions (Dk'tronics and the like). Detected by the
# Amstrad Diagnostics ROM's "UPPER RAM TEST" like real expansion hardware.
# 0 by default (standard 128KB, unchanged behaviour). Capped at 56 (= 3.5MB
# of extra RAM, the maximum the expansion protocol can address).
extra_ram_banks = 0

[rom]
# ROM file paths. All optional: missing entries fall back to
# ~/.bytebox/ROM/<filename shown below> — the tree an installer is expected
# to create and populate (see Plan V2.md, milestone M6). No further
# fallback beyond that: if a ROM is missing from there, loading fails
# outright rather than silently reaching for some other directory.
# `system` may point to a combined 32KB OS+BASIC dump (e.g. Caprice32's
# rom/cpc6128.rom) instead of a bare 16KB OS ROM; in that case it is split
# in half automatically and `basic` is ignored.
# system = "~/.bytebox/ROM/OS6128-AZERTY.rom"
# basic = "~/.bytebox/ROM/BASIC1-1-AZERTY.ROM"
# amsdos = "~/.bytebox/ROM/AMSDOS.ROM"
# diagnostic_upper = "~/.bytebox/ROM/AmstradDiagUpper.rom"
#
# None of the above is validated for content or keyboard layout: pointing
# `system`/`basic` at a QWERTY (or any other non-AZERTY) dump loads and
# boots exactly as normal. Only the physical/virtual keyboard mapping
# suffers — it's calibrated for AZERTY (see doc/roms-installation.md) and
# doesn't know which ROM is loaded, so typed characters would be wrong.
# Nothing else breaks.
