[drives]
drive_b = true

[debugger]
keyboard = false
# Reports on the console whenever the audio regulation has to step in
# (silence inserted because the sound card ran dry, or a frame dropped
# because it was too far behind). Both stretch or skip the sound, so they
# are worth knowing about when chasing a timing problem.
audio = false

[file]
# Directory searched for a disk image given by its bare filename (console
# "disk" command, or the --disk command-line option), when that name is not
# already a valid path as given. A full or relative path still takes
# priority over this default.
dsk_path = "bin"

[display]
# Window zoom level at startup: "x1", "x2", "x3" or "fullscreen". Same
# effect as pressing F1/F2/F3/F4 once the window is up. Missing or
# unrecognized falls back to "x1".
default_zoom = "x1"
