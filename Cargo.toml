[workspace]
resolver = "2"
members = ["core", "bytebox"]

# `cargo build`/`cargo test`/`cargo run` sans `-p` agissent sur tous les
# membres par défaut ; `bytebox` reste le binaire à lancer
# (`cargo run -p bytebox`, ou simplement `cargo run` puisque c'est le seul
# membre à définir un binaire).

# TEMPORAIRE — à retirer une fois zilog_z80 1.1.0 publié sur crates.io.
# `snapshot::load` a besoin de `CPU::set_interrupt_state` (restauration de
# IM/IFF1/IFF2 : champs privés, getters seulement jusqu'ici), ajouté dans
# la 1.1.0 de cette crate. Un `[patch]` à la racine plutôt qu'une
# dépendance `path` dans core/ ET bytebox/ : les deux membres gardent leur
# `zilog_z80 = "1.0.0"` habituel (^1.0.0 accepte donc la 1.1.0 publiée le
# jour venu), et il n'y aura que ce bloc-ci à supprimer.
[patch.crates-io]
zilog_z80 = { path = "../ZilogZ80" }

[profile.release]
panic = "abort"
strip = true

# Profil réservé aux binaires distribués (packaging, voir Plan V2.md M6) :
# LTO et un seul codegen-unit gagnent en performance et en taille, mais
# multiplient par ~5 le temps d'une recompilation incrémentale (mesuré :
# 1,5 s -> 7,7 s pour un seul fichier modifié), à cause de la perte de
# parallélisme entre unités de compilation. Inadapté au cycle
# build/test quotidien (`cargo build --release` / `cargo test --release`,
# utilisés des dizaines de fois par session de mise au point) : on ne
# l'impose donc pas dans [profile.release]. Invocation :
# `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
