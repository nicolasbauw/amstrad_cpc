name: Build packages

# Déclenché sur un tag de release (convention du projet : "2.0.0", pas de
# préfixe "v" — voir packaging/PKGBUILD) et manuellement via
# workflow_dispatch, pour pouvoir tester le workflow lui-même sans avoir à
# pousser un tag à chaque itération. Un déclenchement manuel ne publie
# RIEN par défaut (voir le "if" de chaque étape "Attach to the GitHub
# release" plus bas) : un run manuel n'a pas de tag associé, donc pas de
# release à mettre à jour, sauf si `publish` est explicitement coché — ce
# qui demande alors de préciser QUEL tag/release cibler, `github.ref_name`
# valant le nom de la branche dans ce cas, pas un tag.
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the build artifacts to an existing GitHub release"
        type: boolean
        default: false
      tag:
        description: "Tag/release to publish to (only used if 'publish' is checked)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # AppImage (Linux) : SDL2 liée statiquement (feature Cargo "static-sdl2",
  # voir bytebox/Cargo.toml) puisqu'une AppImage doit tourner sur des
  # distributions qu'on ne contrôle pas, sans dépendre d'un paquet système
  # SDL2 particulier. Les ROMs et ~/.bytebox, ~/.config/bytebox ne sont pas
  # à préparer ici : ByteBox les crée/peuple lui-même au premier lancement
  # (voir core/src/config.rs), quel que soit le format de paquet — même
  # principe que le PKGBUILD AUR.
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sur un push de tag, github.ref_name EST le tag ("2.0.0"). Sur un
      # déclenchement manuel, c'est le nom de la branche — inutilisable pour
      # nommer l'artefact ou cibler une release, d'où l'input `tag` dans ce
      # cas (voir le commentaire de `on:` en tête de fichier).
      - name: Determine version
        id: version
        run: echo "value=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cmake : nécessaire pour compiler SDL2 depuis les sources (feature
      # "bundled"). Le reste : bibliothèques de dev pour chacun des backends
      # que SDL2 sait cibler (X11, Wayland, ALSA, PulseAudio...) — sans elles,
      # le SDL2 compilé perdrait le support de certains environnements de
      # bureau au lieu d'échouer franchement à la compilation.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libpulse-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxss-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libudev-dev

      # CMAKE_POLICY_VERSION_MINIMUM : SDL2 (compilée depuis les sources par
      # la feature "bundled") déclare un `cmake_minimum_required` trop ancien
      # pour CMake 4, qui a retiré tout support des projets sans version
      # plancher >= 3.5 — sans ça, la configuration du build SDL2 échoue tout
      # court sur les runners récents. Variable d'environnement dédiée que
      # CMake lui-même reconnaît (ajoutée par Kitware justement pour ce genre
      # de cas), pas un `-D` à passer à la main : le crate `cmake` (via
      # sdl2-sys) invoque `cmake` en sous-processus, qui hérite de l'env.
      - name: Build (SDL2 statique, build "officiel")
        env:
          BYTEBOX_PACKAGED_BUILD: "1"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --profile dist --locked -p bytebox --features static-sdl2

      # linuxdeploy assemble l'AppDir (résolution des bibliothèques
      # partagées restantes, génération de l'AppRun) puis produit l'AppImage.
      # APPIMAGE_EXTRACT_AND_RUN : les runners GitHub n'ont pas FUSE, requis
      # par défaut pour exécuter une AppImage (linuxdeploy et appimagetool
      # sont eux-mêmes distribués comme des AppImages) — cette variable leur
      # fait extraire puis lancer leur contenu directement à la place.
      #
      # --icon-file copie le fichier donné SOUS SON PROPRE NOM dans l'AppDir
      # (pas de renommage) : packaging/bytebox.desktop porte "Icon=bytebox",
      # donc le fichier doit s'appeler bytebox.png, pas bytebox_icon.png —
      # d'où la copie préalable sous ce nom.
      - name: Assemble the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          cp assets/bytebox_icon.png bytebox.png
          ./linuxdeploy --appdir AppDir \
            --executable target/dist/bytebox \
            --desktop-file packaging/bytebox.desktop \
            --icon-file bytebox.png \
            --output appimage
          mv ByteBox*.AppImage "bytebox-${{ steps.version.outputs.value }}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: bytebox-appimage
          path: bytebox-*.AppImage

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: bytebox-*.AppImage

  # MSI Windows : compilé nativement sur un runner Windows (toolchain MSVC
  # déjà en place), pas de cross-compilation depuis Linux. SDL2 également
  # liée statiquement, pour ne pas avoir à faire trouver un SDL2.dll par
  # l'utilisateur final. cargo-wix (WiX Toolset v3) génère le .msi à partir
  # de bytebox/wix/main.wxs.
  #
  # AUCUN TEST RÉEL EFFECTUÉ SUR WINDOWS À CE STADE (voir la conversation
  # qui a produit ce workflow) : ce job prouve que ça compile et s'empaquette,
  # pas que ça se lance correctement chez un utilisateur — à vérifier
  # manuellement dès que possible.
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Voir le commentaire équivalent du job appimage ci-dessus. shell:
      # bash explicite : le shell par défaut sur windows-latest est pwsh,
      # qui ne comprend pas cette syntaxe de redirection.
      - name: Determine version
        id: version
        shell: bash
        run: echo "value=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Install WiX Toolset v3
        run: choco install wixtoolset -y --no-progress

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wixBin) { throw "WiX Toolset bin folder not found" }
          echo "$($wixBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Voir le commentaire équivalent du job appimage ci-dessus : même
      # incompatibilité CMake 4 / cmake_minimum_required trop ancien de SDL2,
      # côté Windows aussi.
      - name: Build (SDL2 statique, build "officiel")
        env:
          BYTEBOX_PACKAGED_BUILD: "1"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --profile dist --locked -p bytebox --features static-sdl2

      # --no-build : on a déjà compilé nous-mêmes juste au-dessus, avec la
      # feature static-sdl2 et BYTEBOX_PACKAGED_BUILD — cargo-wix ne doit pas
      # relancer son propre `cargo build` par défaut (profil Release, sans
      # ces réglages), qui produirait un binaire différent de celui empaqueté.
      #
      # working-directory: bytebox — bytebox/wix/main.wxs référence
      # "wix\License.rtf" et "..\assets\bytebox_icon.ico", des chemins
      # relatifs qui supposent bytebox/ comme répertoire courant de WiX (là
      # où `cargo wix init` les a écrits). Lancé depuis la racine du dépôt
      # (`-p bytebox` seul, sans changer de dossier), WiX les cherchait
      # relatifs à la racine et échouait ("cannot find wix\License.rtf").
      # -o ../target/wix/ compense le changement de répertoire courant : le
      # dossier cible reste target/wix/ à la racine, comme le lisent les
      # étapes suivantes, pas un target/ local à bytebox/. -p bytebox reste
      # nécessaire même depuis ce dossier : cargo-wix détecte le workspace
      # en remontant jusqu'à sa racine quel que soit le répertoire courant,
      # et réclame un nom de paquet explicite dès qu'il en trouve un.
      - name: Package the MSI
        working-directory: bytebox
        run: cargo wix -p bytebox --no-build --profile dist --nocapture -o ../target/wix/

      - name: Rename the installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/wix/*.msi | Select-Object -First 1
          Rename-Item $msi.FullName "bytebox-${{ steps.version.outputs.value }}-x86_64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: bytebox-windows-msi
          path: target/wix/bytebox-*.msi

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: target/wix/bytebox-*.msi

  # Homebrew : construit et teste la Formula (packaging/homebrew/bytebox.rb)
  # exactement comme un utilisateur macOS le ferait (`brew install
  # --build-from-source` depuis le fichier local, avant toute publication
  # dans un tap) — contrairement au job Windows ci-dessus, celui-ci est donc
  # une vraie vérification, pas seulement "ça compile en CI".
  # SDL2 reste liée dynamiquement ici (`depends_on "sdl2"` dans la Formula,
  # pas la feature static-sdl2) : Homebrew EST le gestionnaire de
  # dépendances système sur macOS, inutile de la recompiler.
  macos-homebrew:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Voir le commentaire équivalent du job appimage ci-dessus.
      - name: Determine version
        id: version
        run: echo "value=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      # Homebrew refuse désormais d'installer une formule hors tap
      # ("Homebrew requires formulae to be in a tap") : un tap local (un
      # simple dépôt git sur le disque du runner, rien à publier) suffit —
      # aucune différence pratique avec un vrai tap distant pour ce test.
      - name: Build and test the Formula
        run: |
          brew tap-new nicolasbauw/bytebox
          cp packaging/homebrew/bytebox.rb "$(brew --repository nicolasbauw/bytebox)/Formula/bytebox.rb"
          brew install --build-from-source nicolasbauw/bytebox/bytebox
          brew test nicolasbauw/bytebox/bytebox

      - name: Archive the installed binary and the .app bundle
        run: |
          mkdir -p dist
          cp "$(brew --prefix bytebox)/bin/bytebox" dist/
          cp -R "$(brew --prefix bytebox)/ByteBox.app" dist/
          tar -C dist -czf "bytebox-${{ steps.version.outputs.value }}-macos-arm64.tar.gz" bytebox ByteBox.app

      - uses: actions/upload-artifact@v4
        with:
          name: bytebox-macos
          path: bytebox-*.tar.gz

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: bytebox-*.tar.gz
